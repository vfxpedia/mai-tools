name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python common/hygiene_check.py

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MAI_TOOLS_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python common/run_all_tests.py ${{ matrix.os == 'macos-latest' && '--skip mai-codex-gauge' || '' }}
      # mai-codex-gauge on macOS has one known failure (installed hook launched by /bin/sh prints nothing), recorded in
      # docs/PLATFORMS.md. It still runs and is reported, but does not block until that is fixed.
      - if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: python common/run_all_tests.py mai-codex-gauge

  mai-gauge:
    # Runs the Claude Code mod checks with the public CLI and no signed-in account. Not yet known to work on a runner:
    # reported, not blocking, until its first result has been read.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate mods/mai-gauge
      - run: claude plugin test mods/mai-gauge
