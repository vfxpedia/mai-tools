<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탭 보관함</title>
<meta name="theme-color" content="#f6f7f9">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --fg: #15171a; --muted: #3d434b; --line: #c9ced6;
    --accent: #2b6fd6; --accent-fg: #ffffff; --ok: #0b7a3b; --ok-bg: #d9f2e3; --warn: #8a5a00; --warn-bg: #fdecc8; --bad: #a3191f; --bad-bg: #fbdcdd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --panel: #1a1d22; --fg: #eceef1; --muted: #c3c8d0; --line: #3a4049;
      --accent: #6ea2f5; --accent-fg: #101215; --ok: #62d68c; --ok-bg: #12301f; --warn: #f2c14e; --warn-bg: #3a2c0a; --bad: #ff8b90; --bad-bg: #3d1618;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  h1 { font-size: 18px; margin: 0; }
  #pc { font-weight: 600; }
  #mem { color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  input[type=search] { flex: 1 1 14rem; min-width: 0; min-height: 40px; padding: 6px 10px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  button { min-height: 40px; padding: 6px 12px; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.go { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; min-height: 40px; }
  main { padding: 12px 16px 120px; }
  #note { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; display: none; }
  #note.warn { display: block; color: var(--warn); background: var(--warn-bg); }
  #note.bad { display: block; color: var(--bad); background: var(--bad-bg); }
  section.grp { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
  .ghead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .ghead h2 { font-size: 16px; margin: 0; margin-right: auto; }
  .count { color: var(--muted); font-weight: 400; margin-left: 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 4px 8px; align-items: start; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li input { width: 20px; height: 20px; margin-top: 3px; }
  .t a { color: var(--fg); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .t a:hover { text-decoration: underline; }
  .line { color: var(--muted); overflow-wrap: anywhere; font-size: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .b { font-size: 13px; padding: 0 8px; border-radius: 999px; font-weight: 600; }
  .b.awake { color: var(--ok); background: var(--ok-bg); }
  .b.asleep { color: var(--warn); background: var(--warn-bg); }
  .b.dup { color: var(--bad); background: var(--bad-bg); }
  .acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .acts button { min-height: 36px; padding: 4px 8px; font-size: 14px; }
  .more { padding: 8px 12px; }
  #log { margin-top: 18px; }
  #log h2 { font-size: 16px; }
  #log li { grid-template-columns: minmax(0, 1fr); }
  #sel { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 2px solid var(--accent); padding: 10px 16px; display: none; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 3; }
  #sel.show { display: flex; }
  #sel span { font-weight: 600; margin-right: auto; }
  @media (max-width: 640px) {
    header { position: static; }
    li { grid-template-columns: 2rem minmax(0, 1fr); }
    .acts { grid-column: 2; justify-content: flex-start; }
  }
</style>
</head>
<body>
<header>
  <div class="top"><h1>탭 보관함</h1><span id="pc">PC 연결 확인 중</span><span id="mem"></span></div>
  <div class="controls">
    <button id="by-cat" class="on" type="button">분류별</button>
    <button id="by-day" type="button">날짜별</button>
    <input id="q" type="search" placeholder="제목 · 주소 · 설명 찾기" aria-label="찾기">
    <label class="chk"><input id="openonly" type="checkbox"> PC 에 열린 것만</label>
    <button id="dedupe" class="danger" type="button" hidden>PC 중복 탭 정리</button>
  </div>
</header>
<main>
  <div id="note" role="status"></div>
  <div id="list"></div>
  <section id="log"><h2>최근 동작</h2><ul id="logs"></ul></section>
</main>
<div id="sel" role="region" aria-label="선택한 항목"><span id="selcount"></span>
  <button class="go" data-act="open-group" type="button">PC 에 그룹으로 열기</button>
  <button data-act="open-asleep" type="button">잠든 채로 열기</button>
  <button data-act="sleep" type="button">재우기</button>
  <button class="danger" data-act="close" type="button">닫기</button>
  <button data-act="clear" type="button">선택 해제</button>
</div>
<script src="app.js"></script>
</body>
</html>
