[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mai-watch"
version = "0.3.0a3"
description = "Read-only live view of CPU, RAM, GPU, VRAM, disks, network and AI session usage, with a job liveness and idle record"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# psutil gives CPU, RAM, disk and network. Without it (running from a checkout with python -m) those values show as unknown.
dependencies = ["psutil>=5.9"]

[project.scripts]
mai-watch = "mai_watch.cli:main"

[tool.setuptools]
packages = ["mai_watch"]

[tool.setuptools.package-data]
mai_watch = ["viewer.html", "viewer-health.js", "viewer-live.js", "viewer-connection.js", "manifest.webmanifest", "viewer-icon.svg"]
